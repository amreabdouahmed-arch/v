[package]
name = "velo-search-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "velo-search-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
futures-util = "0.3"
mongodb = "3"
mysql_async = { version = "0.35", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "brotli"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
encoding_rs = "0.8"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap"] }
