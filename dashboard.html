<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Velo Service Status</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMjU2M2ViIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMzhiZGY4Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTUiIGZpbGw9InVybCgjZykiLz48Y2lyY2xlIGN4PSIyNyIgY3k9IjI3IiByPSIxMiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjUiLz48bGluZSB4MT0iMzciIHkxPSIzNyIgeDI9IjQ5IiB5Mj0iNDkiIHN0cm9rZT0iI2ZmZmZmZiIgc3Ryb2tlLXdpZHRoPSI2IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4=" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #1e2329;
      --muted: #6e7781;
      --blue: #2b6ca3;
      --border: #edf3f8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: #fff;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px clamp(20px, 6vw, 88px);
      border-bottom: 1px solid var(--border);
    }

    header a {
      color: var(--blue);
      text-decoration: none;
    }

    .brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 30px;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    main {
      width: min(100% - 40px, 900px);
      margin: 44px auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 500;
    }

    .intro,
    #dashboard-status,
    .updated {
      color: var(--muted);
    }

    #dashboard-status {
      min-height: 24px;
      margin: 22px 0 14px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .service-card {
      min-height: 118px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 5px 18px rgba(93, 155, 236, 0.08);
    }

    .service-name {
      margin-bottom: 12px;
      font-weight: 600;
    }

    .service-state {
      color: var(--muted);
      font-size: 14px;
      text-transform: capitalize;
    }

    .service-state[data-state='connected'],
    .service-state[data-state='available'] {
      color: #267343;
    }

    .service-state[data-state='error'],
    .service-state[data-state='disconnected'] {
      color: #b54738;
    }

    .service-count {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .updated {
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Velo</a>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/results">Search</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main>
    <h1>Search services</h1>
    <p class="intro">Connection status for the search providers configured in this running service.</p>
    <p id="dashboard-status" role="status" aria-live="polite">Loading service status...</p>
    <section class="service-grid" id="service-grid" aria-label="Service statuses"></section>
    <p class="updated" id="updated-at"></p>
  </main>

  <script>
    const serviceNames = {
      tidb: 'TiDB',
      mongodb: 'MongoDB',
      vector: 'Semantic search',
      pagerank: 'PageRank',
      spellcheck: 'Spell checker',
      search_index: 'VELO keyword index'
    };

    const ADMIN_TOKEN_KEY = 'velo_admin_token';

    function renderService(name, details) {
      const card = document.createElement('article');
      card.className = 'service-card';

      const title = document.createElement('h2');
      title.className = 'service-name';
      title.textContent = serviceNames[name] || name;
      card.append(title);

      const state = document.createElement('p');
      state.className = 'service-state';
      state.dataset.state = details.status || 'unknown';
      state.textContent = details.status || 'unknown';
      card.append(state);

      if (Number.isFinite(details.pages)) {
        const count = document.createElement('p');
        count.className = 'service-count';
        count.textContent = `${details.pages.toLocaleString()} pages`;
        card.append(count);
      }

      if (Number.isFinite(details.vocabulary_size)) {
        const terms = document.createElement('p');
        terms.className = 'service-count';
        terms.textContent = `Vocabulary: ${details.vocabulary_size.toLocaleString()} terms`;
        card.append(terms);
      }

      return card;
    }

    function dashboardHeaders(token) {
      if (!token) {
        return {};
      }
      return {'X-Admin-Token': token};
    }

    async function loadDashboard() {
      const status = document.getElementById('dashboard-status');
      const grid = document.getElementById('service-grid');

      try {
        let response = await fetch('/admin/dashboard', {
          headers: dashboardHeaders(localStorage.getItem(ADMIN_TOKEN_KEY))
        });

        if (response.status === 401) {
          const token = window.prompt('Admin token:');
          if (token) {
            localStorage.setItem(ADMIN_TOKEN_KEY, token);
          }
          response = token
            ? await fetch('/admin/dashboard', {headers: dashboardHeaders(token)})
            : response;
          if (response.status === 401) {
            grid.replaceChildren();
            status.textContent = 'Admin token required.';
            return;
          }
        }

        if (!response.ok) {
          throw new Error(`Dashboard request failed (${response.status})`);
        }

        const data = await response.json();
        const services = Object.entries(data.databases || {})
          .filter(([name]) => name !== 'cockroach');
        grid.replaceChildren(...services.map(([name, details]) => renderService(name, details)));
        const index = data.search_index || {};
        grid.append(renderService('search_index', {status: 'available', pages: index.documents || 0}));
        const queue = document.createElement('p');
        queue.className = 'updated';
        queue.textContent = `Queued crawl URLs: ${(index.queued_urls || 0).toLocaleString()}`;
        grid.after(queue);
        status.textContent = services.length ? '' : 'No service status is available.';
        document.getElementById('updated-at').textContent = data.timestamp
          ? `Last checked: ${new Date(data.timestamp * 1000).toLocaleString()}`
          : '';
      } catch (error) {
        status.textContent = 'Could not load service status. Please try again later.';
        console.error('Dashboard request failed:', error);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
