name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Test and lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_search

      - name: Run tests
        run: cargo test --locked --manifest-path rust_search/Cargo.toml

      - name: Run clippy
        run: cargo clippy --locked --manifest-path rust_search/Cargo.toml --all-targets -- -D warnings
