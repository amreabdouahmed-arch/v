name: CI

on:
  push:
    branches: [master, main, 'sprint-**']
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: Test and lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_search

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path rust_search/Cargo.toml 2>&1 | tee cargo-test.log

      - name: Report test outcome
        if: always()
        shell: bash
        run: |
          : > ann.txt
          grep -E '^[[:space:]]*(error|warning)' cargo-test.log | head -n 5 >> ann.txt || true
          grep -E 'test result:|panicked at|^failures:' cargo-test.log | head -n 5 >> ann.txt || true
          head -n 10 ann.txt | while IFS= read -r l; do
            l="${l//%/%25}"
            case "$l" in
              error*|*panicked*|failures:*) printf '::error title=cargo-test::%s\n' "$l" ;;
              *) printf '::notice title=cargo-test::%s\n' "$l" ;;
            esac
          done

      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path rust_search/Cargo.toml --all-targets -- -D warnings 2>&1 | tee cargo-clippy.log

      - name: Report clippy outcome
        if: always()
        shell: bash
        run: |
          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' cargo-clippy.log > plain.txt || true
          grep -E '^[[:space:]]*-->' plain.txt | head -n 4 > ann2.txt || true
          grep -E '^[[:space:]]*(error|warning)(\[|:)' plain.txt | head -n 4 >> ann2.txt || true
          grep -E '^[[:space:]]*(help|note):' plain.txt | head -n 2 >> ann2.txt || true
          n=$(wc -l < ann2.txt)
          printf '::notice title=clippy-count::diagnostic lines: %s\n' "$n"
          if [ "$n" -eq 0 ]; then
            tail -n 10 plain.txt | while IFS= read -r l; do
              l="${l//%/%25}"; printf '::error title=clippy-tail::%s\n' "$l"
            done
          else
            head -n 9 ann2.txt | while IFS= read -r l; do
              l="${l//%/%25}"; printf '::error title=cargo-clippy::%s\n' "$l"
            done
          fi