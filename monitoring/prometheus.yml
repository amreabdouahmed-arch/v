# Prometheus configuration for monitoring VELO Search Engine
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NOTE: the Rust API does not expose a /metrics endpoint, so there are no
  # Prometheus metrics to scrape here. /health is used as the liveness probe
  # target; availability is derived from scrape success only.
  - job_name: 'search-engine-api-health'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/health'
    scrape_interval: 10s
